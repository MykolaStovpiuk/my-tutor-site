<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажер слів — Микола Стовп'юк</title>
<meta name="description" content="Персональний тренажер словника: додавай нові слова та фрази і повторюй їх за системою інтервального повторення.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#FBF1E4;
    --paper-soft:#F3E6D3;
    --ink:#2B3630;
    --teal:#2F6660;
    --teal-deep:#1E4642;
    --marigold:#E9A23B;
    --coral:#E2603F;
    --line: rgba(43,54,48,0.14);
    --good:#3f8a5e;
    --bad:#c9503a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0; font-weight:600; letter-spacing:-0.01em;}
  a{color:inherit;}
  button, input{font-family:inherit;}
  .wrap{max-width:760px; margin:0 auto; padding:0 24px;}
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:0.78rem;
    color:var(--teal-deep);
    display:inline-flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .eyebrow::before{content:""; width:22px; height:1px; background:var(--coral); display:inline-block;}
  a:focus-visible, button:focus-visible, input:focus-visible{outline:3px solid var(--teal); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}

  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(251,241,228,0.9);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  nav .wrap{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:900px;}
  .brand{font-family:'Fraunces', serif; font-size:1.1rem; font-weight:600;}
  .back-link{font-size:0.9rem; text-decoration:none; opacity:0.75;}
  .back-link:hover{opacity:1;}
  .switch-student{
    background:none; border:1px solid var(--line); border-radius:100px;
    padding:6px 14px; font-size:0.82rem; cursor:pointer; color:var(--ink);
  }

  header.top{padding:44px 0 10px; text-align:center;}
  header.top h1{font-size:clamp(1.9rem, 4vw, 2.5rem);}
  header.top p{max-width:52ch; margin:12px auto 0; color:#4a534b;}

  main{padding-bottom:80px; min-height:200px;}

  .loading{text-align:center; padding:60px 20px; color:#5c6660; font-family:'Space Mono', monospace; font-size:0.9rem;}
  .error-box{
    max-width:480px; margin:40px auto; background:#fff2ed; border:1px solid var(--bad);
    border-radius:16px; padding:22px; text-align:center; color:var(--bad); font-size:0.9rem;
  }

  /* ---------- PROFILE SCREEN ---------- */
  .profile-box{
    max-width:420px; margin:40px auto; background:#fff;
    border:1px solid var(--line); border-radius:20px; padding:32px 28px;
    text-align:center;
  }
  .profile-box h2{font-size:1.4rem; margin-bottom:8px;}
  .profile-box p{color:#4a534b; font-size:0.92rem; margin-bottom:22px;}
  .existing-students{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:22px;}
  .student-chip{
    border:1.5px solid var(--line); background:var(--paper-soft);
    border-radius:100px; padding:8px 16px; font-size:0.88rem; cursor:pointer;
  }
  .student-chip:hover{border-color:var(--teal);}
  .name-row{display:flex; gap:8px;}
  .name-row input{
    flex:1; border:1.5px solid var(--line); border-radius:10px;
    padding:11px 14px; font-size:0.95rem;
  }
  .start-btn{
    border:none; background:var(--coral); color:var(--paper);
    padding:11px 20px; border-radius:10px; font-weight:700; cursor:pointer;
  }
  .start-btn:disabled{opacity:0.6; cursor:default;}

  /* ---------- STATS BAR ---------- */
  .stats-bar{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin:26px 0;
  }
  .stat{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:16px; text-align:center;
  }
  .stat .num{font-family:'Fraunces', serif; font-size:1.6rem; color:var(--teal);}
  .stat .lbl{font-family:'Space Mono', monospace; font-size:0.7rem; color:#5c6660; margin-top:2px;}

  /* ---------- TABS ---------- */
  .tabs{display:flex; justify-content:center; gap:8px; margin-bottom:30px; flex-wrap:wrap;}
  .tab-btn{
    border:none; background:var(--paper-soft); color:var(--ink); opacity:0.65;
    padding:10px 18px; border-radius:10px; font-size:0.88rem; font-weight:600; cursor:pointer;
    font-family:'Space Mono', monospace;
  }
  .tab-btn.active{opacity:1; background:var(--marigold);}

  /* ---------- REVIEW ---------- */
  .review-wrap{display:flex; flex-direction:column; align-items:center; gap:20px;}
  .progress-text{font-family:'Space Mono', monospace; font-size:0.85rem; color:#5c6660;}
  .flip-card{width:100%; max-width:420px; height:220px; perspective:1200px; cursor:pointer;}
  .flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:20px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; padding:20px; text-align:center;
    box-shadow:0 10px 26px rgba(43,54,48,0.14);
  }
  .flip-front{background:#fff; border:1px solid var(--line);}
  .flip-back{background:var(--teal); color:var(--paper); transform:rotateY(180deg);}
  .flip-face .word{font-family:'Fraunces', serif; font-size:1.6rem; font-weight:600;}
  .flip-face .example{font-size:0.85rem; margin-top:10px; opacity:0.8; font-style:italic;}
  .flip-face .hint{font-family:'Space Mono', monospace; font-size:0.75rem; opacity:0.6; margin-top:10px;}
  .review-actions{display:flex; gap:12px;}
  .hard-btn, .easy-btn{border:none; border-radius:100px; padding:12px 22px; font-weight:700; font-size:0.9rem; cursor:pointer;}
  .hard-btn:disabled, .easy-btn:disabled{opacity:0.6; cursor:default;}
  .hard-btn{background:var(--bad); color:#fff;}
  .easy-btn{background:var(--good); color:#fff;}
  .empty-state{
    text-align:center; padding:50px 20px; color:#4a534b;
  }
  .empty-state .big{font-family:'Fraunces', serif; font-size:1.6rem; color:var(--ink); margin-bottom:10px;}

  /* ---------- REVIEW MODE SELECTOR ---------- */
  .review-modes{display:flex; justify-content:center; gap:6px; margin-bottom:26px; flex-wrap:wrap;}
  .rmode-btn{
    border:1.5px solid var(--line); background:#fff; color:var(--ink); opacity:0.7;
    padding:8px 14px; border-radius:100px; font-size:0.82rem; cursor:pointer;
  }
  .rmode-btn.active{opacity:1; border-color:var(--teal); background:var(--paper-soft); font-weight:700;}

  /* ---------- QUIZ ---------- */
  .quiz-wrap{max-width:440px; margin:0 auto; text-align:center;}
  .quiz-word{font-family:'Fraunces', serif; font-size:1.7rem; margin-bottom:22px;}
  .quiz-options{display:grid; gap:10px;}
  .quiz-option{
    border:1.5px solid var(--line); background:#fff;
    padding:13px 16px; border-radius:12px; font-size:0.95rem; cursor:pointer; text-align:left;
  }
  .quiz-option.correct{background:var(--good); color:#fff; border-color:var(--good);}
  .quiz-option.wrong{background:var(--bad); color:#fff; border-color:var(--bad);}
  .quiz-option:disabled{cursor:default;}

  /* ---------- TYPING ---------- */
  .type-wrap{max-width:420px; margin:0 auto; text-align:center;}
  .type-word{font-family:'Fraunces', serif; font-size:1.7rem; margin-bottom:22px;}
  .type-input{
    width:100%; border:1.5px solid var(--line); border-radius:12px;
    padding:13px 16px; font-size:1rem; text-align:center; margin-bottom:14px;
  }
  .type-input.correct{border-color:var(--good); background:#eef8f0;}
  .type-input.wrong{border-color:var(--bad); background:#fdf0ee;}
  .type-feedback{font-size:0.88rem; min-height:1.4em; margin-bottom:14px;}
  .type-feedback.correct{color:var(--good); font-weight:700;}
  .type-feedback.wrong{color:var(--bad); font-weight:700;}
  .type-submit{
    border:none; background:var(--teal); color:var(--paper);
    padding:12px 26px; border-radius:100px; font-weight:700; cursor:pointer; font-size:0.9rem;
  }

  /* ---------- MATCH ---------- */
  .match-wrap{max-width:600px; margin:0 auto;}
  .match-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:560px){.match-grid{grid-template-columns:repeat(2,1fr);}}
  .match-tile{
    border:1.5px solid var(--line); background:#fff; border-radius:12px;
    padding:14px 10px; font-size:0.88rem; text-align:center; cursor:pointer;
    min-height:60px; display:flex; align-items:center; justify-content:center;
  }
  .match-tile.selected{border-color:var(--marigold); background:#FFF4E0;}
  .match-tile.matched{background:var(--good); color:#fff; border-color:var(--good); cursor:default; opacity:0.85;}
  .match-tile.shake{background:var(--bad); color:#fff; border-color:var(--bad);}

  /* ---------- ADD FORM ---------- */
  .add-form{max-width:460px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.82rem; font-family:'Space Mono', monospace; margin-bottom:6px; color:#4a534b;}
  .field input, .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:10px;
    padding:11px 14px; font-size:0.95rem; resize:vertical;
  }
  .add-submit{
    width:100%; border:none; background:var(--teal); color:var(--paper);
    padding:13px; border-radius:10px; font-weight:700; cursor:pointer; font-size:0.95rem;
  }
  .add-submit:disabled{opacity:0.6; cursor:default;}
  .added-msg{
    text-align:center; color:var(--good); font-size:0.88rem; margin-top:12px; font-weight:600;
    min-height:1.2em;
  }

  /* ---------- WORD LIST ---------- */
  .word-table{width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; border:1px solid var(--line);}
  .word-table th, .word-table td{padding:12px 14px; text-align:left; font-size:0.88rem; border-bottom:1px solid var(--line);}
  .word-table th{font-family:'Space Mono', monospace; font-size:0.72rem; color:#5c6660; background:var(--paper-soft);}
  .word-table tr:last-child td{border-bottom:none;}
  .box-dots{display:flex; gap:3px;}
  .box-dot{width:8px; height:8px; border-radius:50%; background:var(--line);}
  .box-dot.filled{background:var(--marigold);}
  .del-btn{border:none; background:none; color:var(--bad); cursor:pointer; font-size:0.8rem;}
  .word-list-empty{text-align:center; color:#4a534b; padding:40px 20px;}
  .added-by{font-family:'Space Mono', monospace; font-size:0.7rem; opacity:0.6;}

  footer{text-align:center; padding:30px 0 40px; font-size:0.85rem; color:#6b756c;}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand">Микола Стовп'юк<span style="color:var(--coral)">.</span></div>
    <a class="back-link" href="ua.html">← На головну</a>
  </div>
</nav>

<header class="top">
  <div class="wrap">
    <span class="eyebrow">/rɪˈvɪʒ.ən/ — повторення</span>
    <h1>Твій тренажер слів</h1>
    <p>Додавай слова та фрази, які вивчаєш на заняттях, і повторюй їх, коли настане час. Учитель теж може додати сюди слова після уроку.</p>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  Слова зберігаються на сервері й доступні з будь-якого пристрою.
</footer>

<script>
/* ==================================================================
   НАЛАШТУВАННЯ SUPABASE
   Встав сюди свій Project URL та anon public key
   (Supabase → Project Settings → API).
================================================================== */
const SUPABASE_URL = 'https://lkvactsotpbkwuacepgq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_7neWEfMeG57I_wYOvrcEuw_Wg-kJSfv';
/* ================================================================== */

const sb = (SUPABASE_URL.startsWith('http'))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const CURRENT_KEY = 'vt_current_student';
const INTERVALS = [1, 2, 4, 7, 14, 30]; // дні до наступного повторення на кожному рівні
const MAX_BOX = INTERVALS.length - 1;

/* ====== СТАРТОВІ СЛОВА: додай список для конкретного учня тут ======
   Ключ — ім'я учня маленькими літерами (точно так, як він його вводить
   на екрані вибору). Список підвантажиться автоматично лише один раз —
   коли учень заходить під цим іменем уперше і в нього ще немає жодного
   слова в базі. */
const STARTER_WORDS = {
  // 'олена': [
  //   { en: 'deadline', ua: 'дедлайн', example: 'The deadline is Friday.' },
  // ],
};
/* ==================================================================== */

function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

let currentStudent = localStorage.getItem(CURRENT_KEY) || '';
let currentTab = 'review';
let reviewMode = 'cards';
const app = document.getElementById('app');

/* ================= SUPABASE HELPERS ================= */
async function getStudents(){
  const { data, error } = await sb.from('students').select('name').order('name');
  if(error){ console.error(error); return []; }
  return data.map(r => r.name);
}
async function ensureStudent(name){
  const { error } = await sb.from('students').upsert({ name }, { onConflict: 'name' });
  if(error) console.error(error);
}
async function loadWords(name){
  const { data, error } = await sb.from('words').select('*').eq('student', name).order('due');
  if(error){ console.error(error); return []; }
  return data;
}
async function insertWord(name, word, addedBy){
  const { error } = await sb.from('words').insert({
    student: name, en: word.en, ua: word.ua, example: word.example || '',
    box: 0, due: todayStr(), added: todayStr(), added_by: addedBy
  });
  if(error) console.error(error);
  return !error;
}
async function updateWord(id, fields){
  const { error } = await sb.from('words').update(fields).eq('id', id);
  if(error) console.error(error);
}
async function deleteWordRow(id){
  const { error } = await sb.from('words').delete().eq('id', id);
  if(error) console.error(error);
}

/* ================= РЕНДЕР ================= */
async function render(){
  if(!sb){
    app.innerHTML = `<div class="error-box">Тренажер ще не підключено до бази даних. Встав SUPABASE_URL і SUPABASE_ANON_KEY на початку файлу trainer.html.</div>`;
    return;
  }
  if(!currentStudent){ await renderProfileScreen(); return; }
  await renderTrainer();
}

async function renderProfileScreen(){
  app.innerHTML = `<div class="loading">Завантаження…</div>`;
  const students = await getStudents();
  app.innerHTML = `
    <div class="profile-box">
      <h2>Хто займається?</h2>
      <p>Обери своє ім'я зі списку або введи нове, якщо це твій перший раз.</p>
      ${students.length ? `<div class="existing-students" id="chips"></div>` : ''}
      <div class="name-row">
        <input type="text" id="nameInput" placeholder="Введи ім'я">
        <button class="start-btn" id="startBtn">Почати</button>
      </div>
    </div>`;
  if(students.length){
    const chipsEl = document.getElementById('chips');
    students.forEach(s => {
      const chip = document.createElement('button');
      chip.className = 'student-chip';
      chip.textContent = s;
      chip.onclick = () => selectStudent(s);
      chipsEl.appendChild(chip);
    });
  }
  const startBtn = document.getElementById('startBtn');
  startBtn.onclick = async () => {
    const name = document.getElementById('nameInput').value.trim();
    if(!name) return;
    startBtn.disabled = true;
    startBtn.textContent = '...';
    await selectStudent(name);
  };
  document.getElementById('nameInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') startBtn.click();
  });
}

async function selectStudent(name){
  await ensureStudent(name);
  const words = await loadWords(name);
  const starter = STARTER_WORDS[name.trim().toLowerCase()];
  if(words.length === 0 && starter && starter.length){
    for(const w of starter){
      await insertWord(name, w, 'tutor');
    }
  }
  currentStudent = name;
  localStorage.setItem(CURRENT_KEY, name);
  currentTab = 'review';
  render();
}

async function renderTrainer(){
  app.innerHTML = `<div class="loading">Завантаження…</div>`;
  const words = await loadWords(currentStudent);
  const today = todayStr();
  const dueWords = words.filter(w => w.due <= today);
  const masteredCount = words.filter(w => w.box >= MAX_BOX).length;

  app.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
      <h2 style="font-size:1.2rem;">Привіт, ${currentStudent}!</h2>
      <button class="switch-student" id="switchBtn">Змінити учня</button>
    </div>
    <div class="stats-bar">
      <div class="stat"><div class="num">${words.length}</div><div class="lbl">всього слів</div></div>
      <div class="stat"><div class="num">${dueWords.length}</div><div class="lbl">на сьогодні</div></div>
      <div class="stat"><div class="num">${masteredCount}</div><div class="lbl">вивчено</div></div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${currentTab==='review'?'active':''}" data-tab="review">Повторити</button>
      <button class="tab-btn ${currentTab==='add'?'active':''}" data-tab="add">Додати слово</button>
      <button class="tab-btn ${currentTab==='list'?'active':''}" data-tab="list">Мій словник</button>
    </div>
    <div id="tabContent"></div>`;

  document.getElementById('switchBtn').onclick = () => {
    currentStudent = '';
    localStorage.removeItem(CURRENT_KEY);
    render();
  };
  app.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => { currentTab = btn.dataset.tab; render(); };
  });

  const content = document.getElementById('tabContent');
  if(currentTab === 'review') renderReview(content, words, dueWords);
  else if(currentTab === 'add') renderAddForm(content);
  else renderWordList(content, words);
}

/* ---------- ПОВТОРЕННЯ ---------- */
async function gradeWord(word, correct){
  let box, due;
  if(correct){
    box = Math.min(word.box + 1, MAX_BOX);
    due = addDays(todayStr(), INTERVALS[box]);
  } else {
    box = 0;
    due = addDays(todayStr(), 1);
  }
  await updateWord(word.id, { box, due });
}

function renderReview(container, allWords, dueWords){
  if(dueWords.length === 0){
    container.innerHTML = `
      <div class="empty-state">
        <div class="big">На сьогодні нічого повторювати 🎉</div>
        <p>${allWords.length === 0 ? 'Додай перші слова у вкладці «Додати слово».' : 'Повернись, коли настане час наступного повторення.'}</p>
      </div>`;
    return;
  }

  container.innerHTML = `
    <div class="review-modes" id="reviewModes">
      <button class="rmode-btn" data-mode="cards">Картки</button>
      <button class="rmode-btn" data-mode="quiz">Тест</button>
      <button class="rmode-btn" data-mode="type">Ввести переклад</button>
      <button class="rmode-btn" data-mode="match">Знайти пару</button>
    </div>
    <div id="reviewArea"></div>`;

  const modesEl = document.getElementById('reviewModes');
  modesEl.querySelectorAll('.rmode-btn').forEach(btn => {
    if(btn.dataset.mode === reviewMode) btn.classList.add('active');
    btn.onclick = () => {
      reviewMode = btn.dataset.mode;
      modesEl.querySelectorAll('.rmode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === reviewMode));
      startExercise();
    };
  });

  const area = document.getElementById('reviewArea');
  function startExercise(){
    if(reviewMode === 'cards') runCards(area, dueWords);
    else if(reviewMode === 'quiz') runQuiz(area, dueWords, allWords);
    else if(reviewMode === 'type') runTyping(area, dueWords);
    else runMatch(area, dueWords);
  }
  startExercise();
}

function doneScreen(container, count){
  container.innerHTML = `
    <div class="empty-state">
      <div class="big">Готово на сьогодні!</div>
      <p>Ти повторив(-ла) ${count} ${count===1?'слово':'слів'}. Онови сторінку, щоб спробувати інший формат ще раз.</p>
    </div>`;
}

/* Картки */
function runCards(container, dueWords){
  let idx = 0;
  const queue = dueWords.slice();

  function show(){
    if(idx >= queue.length){ doneScreen(container, queue.length); return; }
    const w = queue[idx];
    container.innerHTML = `
      <div class="review-wrap">
        <div class="progress-text">Слово ${idx+1} із ${queue.length}</div>
        <div class="flip-card" id="flipCard">
          <div class="flip-inner">
            <div class="flip-face flip-front">
              <div class="word">${w.en}</div>
              <div class="hint">натисни, щоб перевірити</div>
            </div>
            <div class="flip-face flip-back">
              <div class="word">${w.ua}</div>
              ${w.example ? `<div class="example">${w.example}</div>` : ''}
            </div>
          </div>
        </div>
        <div class="review-actions">
          <button class="hard-btn" id="hardBtn">Складно</button>
          <button class="easy-btn" id="easyBtn">Легко</button>
        </div>
      </div>`;
    const cardEl = document.getElementById('flipCard');
    cardEl.onclick = () => cardEl.classList.toggle('flipped');
    const hardBtn = document.getElementById('hardBtn');
    const easyBtn = document.getElementById('easyBtn');
    hardBtn.onclick = async () => {
      hardBtn.disabled = true; easyBtn.disabled = true;
      await gradeWord(w, false);
      idx++; show();
    };
    easyBtn.onclick = async () => {
      hardBtn.disabled = true; easyBtn.disabled = true;
      await gradeWord(w, true);
      idx++; show();
    };
  }
  show();
}

/* Тест із варіантами */
function runQuiz(container, dueWords, allWords){
  let idx = 0;
  const queue = dueWords.slice();

  function shuffled(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function distractorsFor(word){
    const pool = allWords.filter(w => w.id !== word.id && w.ua !== word.ua);
    return shuffled(pool).slice(0, 3).map(w => w.ua);
  }

  function show(){
    if(idx >= queue.length){ doneScreen(container, queue.length); return; }
    const w = queue[idx];
    const options = shuffled([w.ua, ...distractorsFor(w)]);
    container.innerHTML = `
      <div class="quiz-wrap">
        <div class="progress-text">Питання ${idx+1} із ${queue.length}</div>
        <div class="quiz-word">${w.en}</div>
        <div class="quiz-options">
          ${options.map(o => `<button class="quiz-option" data-val="${o}">${o}</button>`).join('')}
        </div>
      </div>`;
    container.querySelectorAll('.quiz-option').forEach(btn => {
      btn.onclick = async () => {
        container.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
        const chosen = btn.dataset.val;
        const correct = chosen === w.ua;
        if(correct){ btn.classList.add('correct'); }
        else {
          btn.classList.add('wrong');
          container.querySelectorAll('.quiz-option').forEach(b => { if(b.dataset.val === w.ua) b.classList.add('correct'); });
        }
        await gradeWord(w, correct);
        setTimeout(() => { idx++; show(); }, 900);
      };
    });
  }
  show();
}

/* Ввести переклад вручну */
function runTyping(container, dueWords){
  let idx = 0;
  const queue = dueWords.slice();

  function normalize(s){
    return s.toLowerCase().replace(/\([^)]*\)/g, '').replace(/[.,!?]/g, '').trim().replace(/\s+/g, ' ');
  }

  function show(){
    if(idx >= queue.length){ doneScreen(container, queue.length); return; }
    const w = queue[idx];
    container.innerHTML = `
      <div class="type-wrap">
        <div class="progress-text">Слово ${idx+1} із ${queue.length}</div>
        <div class="type-word">${w.en}</div>
        <input type="text" class="type-input" id="typeInput" placeholder="Введи переклад українською" autocomplete="off">
        <div class="type-feedback" id="typeFeedback"></div>
        <button class="type-submit" id="typeSubmit">Перевірити</button>
      </div>`;
    const input = document.getElementById('typeInput');
    const feedback = document.getElementById('typeFeedback');
    const submitBtn = document.getElementById('typeSubmit');
    input.focus();
    let answered = false;

    async function check(){
      if(answered) return;
      answered = true;
      const correct = normalize(input.value) === normalize(w.ua);
      input.classList.add(correct ? 'correct' : 'wrong');
      input.disabled = true;
      submitBtn.disabled = true;
      feedback.classList.add(correct ? 'correct' : 'wrong');
      feedback.textContent = correct ? 'Правильно!' : `Правильна відповідь: ${w.ua}`;
      await gradeWord(w, correct);
      setTimeout(() => { idx++; show(); }, 1200);
    }
    submitBtn.onclick = check;
    input.addEventListener('keydown', e => { if(e.key === 'Enter') check(); });
  }
  show();
}

/* Знайти пару */
function runMatch(container, dueWords){
  const words = dueWords.slice(0, 6);
  let selected = null;
  let matchedCount = 0;

  function shuffled(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const enTiles = words.map(w => ({ key: w.en, label: w.en, pair: w.ua, wordRef: w }));
  const uaTiles = words.map(w => ({ key: w.ua, label: w.ua, pair: w.en, wordRef: w }));
  const tiles = shuffled([...enTiles, ...uaTiles]);

  function show(){
    container.innerHTML = `
      <div class="match-wrap">
        <div class="progress-text" style="text-align:center; margin-bottom:16px;">Знайдено пар: ${matchedCount} із ${words.length}</div>
        <div class="match-grid" id="matchGrid"></div>
        ${dueWords.length > 6 ? `<p style="text-align:center; color:#5c6660; font-size:0.85rem; margin-top:14px;">Ще ${dueWords.length - 6} слів чекають — повтори цю вправу ще раз після цього набору.</p>` : ''}
      </div>`;
    const grid = document.getElementById('matchGrid');
    tiles.forEach(t => {
      const tile = document.createElement('div');
      tile.className = 'match-tile';
      tile.textContent = t.label;
      tile.dataset.key = t.key;
      if(t.matched) tile.classList.add('matched');
      tile.onclick = () => onTileClick(tile, t);
      grid.appendChild(tile);
    });
  }

  async function onTileClick(tileEl, t){
    if(t.matched || tileEl.classList.contains('selected')) return;
    if(!selected){
      selected = { tileEl, t };
      tileEl.classList.add('selected');
      return;
    }
    if(selected.tileEl === tileEl) return;
    if(selected.t.pair === t.key){
      selected.t.matched = true;
      t.matched = true;
      selected.tileEl.classList.remove('selected');
      selected.tileEl.classList.add('matched');
      tileEl.classList.add('matched');
      matchedCount++;
      const wordRef = t.wordRef;
      const prevSelected = selected;
      selected = null;
      document.querySelector('.progress-text').textContent = `Знайдено пар: ${matchedCount} із ${words.length}`;
      await gradeWord(wordRef, true);
      if(matchedCount === words.length){
        setTimeout(() => doneScreen(container, words.length), 500);
      }
    } else {
      tileEl.classList.add('shake');
      selected.tileEl.classList.add('shake');
      const prevSelected = selected;
      setTimeout(() => {
        tileEl.classList.remove('shake', 'selected');
        prevSelected.tileEl.classList.remove('shake', 'selected');
        selected = null;
      }, 500);
    }
  }

  show();
}

/* ---------- ДОДАТИ СЛОВО ---------- */
function renderAddForm(container){
  container.innerHTML = `
    <div class="add-form">
      <div class="field">
        <label>Слово або фраза англійською</label>
        <input type="text" id="enInput" placeholder="e.g. procrastinate">
      </div>
      <div class="field">
        <label>Переклад українською</label>
        <input type="text" id="uaInput" placeholder="напр. відкладати на потім">
      </div>
      <div class="field">
        <label>Приклад речення (необов'язково)</label>
        <textarea id="exInput" rows="2" placeholder="I always procrastinate before deadlines."></textarea>
      </div>
      <div class="field">
        <label>Хто додає?</label>
        <select id="whoInput" style="width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; font-size:0.95rem;">
          <option value="student">Учень</option>
          <option value="tutor">Викладач</option>
        </select>
      </div>
      <button class="add-submit" id="addSubmit">Додати слово</button>
      <div class="added-msg" id="addedMsg"></div>
    </div>`;

  const addSubmit = document.getElementById('addSubmit');
  addSubmit.onclick = async () => {
    const en = document.getElementById('enInput').value.trim();
    const ua = document.getElementById('uaInput').value.trim();
    const ex = document.getElementById('exInput').value.trim();
    const who = document.getElementById('whoInput').value;
    const msg = document.getElementById('addedMsg');
    if(!en || !ua){
      msg.style.color = 'var(--bad)';
      msg.textContent = 'Заповни слово і переклад.';
      return;
    }
    addSubmit.disabled = true;
    addSubmit.textContent = '...';
    const ok = await insertWord(currentStudent, { en, ua, example: ex }, who);
    addSubmit.disabled = false;
    addSubmit.textContent = 'Додати слово';
    if(ok){
      document.getElementById('enInput').value = '';
      document.getElementById('uaInput').value = '';
      document.getElementById('exInput').value = '';
      msg.style.color = 'var(--good)';
      msg.textContent = `«${en}» додано — з'явиться в сьогоднішньому повторенні.`;
    } else {
      msg.style.color = 'var(--bad)';
      msg.textContent = 'Не вдалося зберегти слово. Спробуй ще раз.';
    }
  };
}

/* ---------- МІЙ СЛОВНИК ---------- */
function renderWordList(container, words){
  if(words.length === 0){
    container.innerHTML = `<div class="word-list-empty">Список поки порожній. Додай перше слово у вкладці «Додати слово».</div>`;
    return;
  }
  const rows = words
    .slice()
    .sort((a,b) => a.due.localeCompare(b.due))
    .map(w => `
      <tr>
        <td>${w.en}</td>
        <td>${w.ua}</td>
        <td>
          <div class="box-dots">
            ${Array.from({length: MAX_BOX+1}).map((_,i) => `<span class="box-dot ${i<=w.box?'filled':''}"></span>`).join('')}
          </div>
        </td>
        <td>${w.due}</td>
        <td class="added-by">${w.added_by === 'tutor' ? 'вчитель' : 'учень'}</td>
        <td><button class="del-btn" data-id="${w.id}">Видалити</button></td>
      </tr>`).join('');

  container.innerHTML = `
    <table class="word-table">
      <thead><tr><th>Слово</th><th>Переклад</th><th>Рівень</th><th>Повторення</th><th>Додав(-ла)</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  container.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      await deleteWordRow(btn.dataset.id);
      render();
    };
  });
}

render();
